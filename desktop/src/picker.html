<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:">
  <title>Share your screen</title>
  <style>
    :root { --bg: #fff; --ink: #101828; --muted: #667085; --line: #e4e7ec; --hover: #f2f4f7; --brand: #4f46e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161a22; --ink: #eef0f4; --muted: #98a2b3; --line: #2a303c; --hover: #1f2430; --brand: #7c74f6; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif; }
    header { padding: 16px 20px 8px; }
    h1 { font-size: 17px; margin: 0; }
    .tabs { display: flex; gap: 6px; padding: 8px 20px 0; }
    .tabs button { font: inherit; border: 1px solid var(--line); background: transparent; color: inherit; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
    .tabs button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
    .grid { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; padding: 16px 20px; align-content: start; }
    .src { border: 2px solid transparent; border-radius: 12px; padding: 8px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .src:hover { background: var(--hover); }
    .src[aria-selected="true"] { border-color: var(--brand); }
    .thumb { aspect-ratio: 16 / 10; width: 100%; border-radius: 8px; background: var(--hover); object-fit: contain; display: block; }
    .name { margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    footer { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
    footer button { font: inherit; font-weight: 600; border-radius: 10px; padding: 8px 16px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
    footer .primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    footer .primary:disabled { opacity: .5; cursor: default; }
    .empty { color: var(--muted); padding: 20px; }
  </style>
</head>
<body>
  <header><h1>Choose what to share</h1></header>
  <div class="tabs" role="tablist">
    <button type="button" data-kind="screen" aria-pressed="true">Entire screen</button>
    <button type="button" data-kind="window" aria-pressed="false">Window</button>
  </div>
  <div class="grid" id="grid" role="listbox" aria-label="Screens and windows"></div>
  <footer>
    <button type="button" id="cancel">Cancel</button>
    <button type="button" id="share" class="primary" disabled>Share</button>
  </footer>
  <script src="picker.js"></script>
</body>
</html>
