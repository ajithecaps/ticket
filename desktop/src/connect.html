<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
  <title>Tickets</title>
  <style>
    :root { --bg: #f6f7fb; --card: #fff; --ink: #101828; --muted: #667085; --line: #e4e7ec; --brand: #4f46e5; --brand-ink: #fff; --err: #b42318; --err-bg: #fef3f2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1218; --card: #161a22; --ink: #eef0f4; --muted: #98a2b3; --line: #2a303c; --brand: #6d64f3; --err: #fda29b; --err-bg: #3a1714; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif; -webkit-app-region: drag; }
    main { width: min(440px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: 0 12px 40px rgba(16, 24, 40, .08); -webkit-app-region: no-drag; }
    .logo { width: 48px; height: 48px; border-radius: 12px; display: block; margin-bottom: 18px; }
    h1 { font-size: 21px; margin: 0 0 6px; letter-spacing: -.01em; }
    p { margin: 0 0 20px; color: var(--muted); }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    input { width: 100%; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
    .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
    .row { display: flex; gap: 10px; margin-top: 22px; }
    button { font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: inherit; }
    button.primary { flex: 1; background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
    button:disabled { opacity: .6; cursor: progress; }
    .error { background: var(--err-bg); color: var(--err); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 18px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/icon.png" alt="">
    <h1 id="title">Connect to your team</h1>
    <p id="lead">Enter the address of your Tickets server - the same one you open in your browser.</p>
    <div class="error" id="error" role="alert" hidden></div>
    <form id="form">
      <label for="server">Server address</label>
      <input id="server" type="text" inputmode="url" placeholder="https://tickets.yourcompany.com" autocomplete="url" spellcheck="false" required>
      <div class="hint">You'll sign in on the next screen.</div>
      <div class="row">
        <button type="button" id="retry" hidden>Try again</button>
        <button type="submit" class="primary" id="go">Connect</button>
      </div>
    </form>
  </main>
  <script src="connect.js"></script>
</body>
</html>
