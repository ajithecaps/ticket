<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grandesk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url%28%23g%29'/%3E%3Cpath d='M23.5 16a7.5 7.5 0 1 1-2.2-5.3M23.5 16h-7' fill='none' stroke='white' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    // apply the saved theme before first paint (no white flash in dark mode)
    try { var t = localStorage.getItem("tickets.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/marked-footnote.umd.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script>
    // If the app's code fails to load (e.g. a file missing on the server), say so instead of showing a blank page.
    window.__appFailed = function (detail) {
      var el = document.getElementById("app");
      if (!el || el.childElementCount) return;
      el.innerHTML = '<div style="max-width:520px;margin:15vh auto;padding:24px;font:15px/1.5 system-ui,sans-serif;color:#344054">'
        + '<h1 style="font-size:20px;margin:0 0 8px">The app failed to load</h1>'
        + '<p style="margin:0 0 12px">A file the page needs could not be loaded. Try a hard refresh (Ctrl/Cmd + Shift + R). '
        + 'If it keeps happening, the server is probably missing a file from the latest release.</p>'
        + '<pre style="white-space:pre-wrap;background:#f2f4f7;padding:10px;border-radius:8px;font-size:12px;color:#b42318"></pre></div>';
      el.querySelector("pre").textContent = detail || "Unknown error";
    };
    window.addEventListener("error", function (e) {
      var src = e.target && (e.target.src || e.target.href);
      if (src) window.__appFailed("Could not load " + src);
    }, true);
    window.addEventListener("unhandledrejection", function (e) { if (!window.__appStarted) window.__appFailed(String(e.reason)); });
    // Module import errors (missing or broken files) don't fire the events above; check after load.
    window.addEventListener("load", function () { setTimeout(function () { if (!window.__appStarted) window.__appFailed("The application script did not start. Open the browser console for details."); }, 4000); });
  </script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
